name: Daily Source Hunter

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hunt-sources:
    name: Run Daily Source Hunter (9:00 AM ET)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Source Hunter on Simon Staging
        run: |
          curl -fsS -X POST https://simon-staging-139550420825.us-east1.run.app/api/sources/hunt -H "Content-Type: application/json" -d '{"count": 3, "live": true}'
